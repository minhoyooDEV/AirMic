name: Compatibility report / 호환성 결과
description: Share actual hardware results, including failures and untested cases.
title: "compatibility: "
labels: [documentation]
body:
  - type: input
    id: commit
    attributes:
      label: Tested commit
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: macOS, Mac architecture, AirPods model/firmware, default input type, call app/version. Omit serial numbers and personal device names.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Mark each case pass, fail, or not tested. Include actual audio behavior, not only UI changes.
      value: |
        - Build and CLI checks:
        - Stem mute/unmute:
        - Audio verified in intended app:
        - Menu/window toggle:
        - Normal quit restoration:
        - Device switching and reconnect:
        - Permission denial and sleep/wake:
    validations:
      required: true
